<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glam Aura - Build Your Own Hamper</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Elms+Sans:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            line-height: 1;
        }
        body {
            font-family: 'Elms Sans', sans-serif;
            background-color: #FFE680;
        }
        /* Layout */
        .builder-container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }
        .header-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header-section h2 {
            font-family: 'DynaPuff', cursive;
            color: #3b1717;
            font-size: 2.5rem;
            margin: 0 0 0.5rem;
        }
        .header-section p {
            color: #555;
            font-size: 1.1rem;
        }
        
        /* Step 1: Hamper Tiers */
        .tiers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .tier-card {
            background: #fff8d6;
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        .tier-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }
        .tier-card.selected {
            border-color: #3b1717;
            background: #fffdf1;
            box-shadow: 0 0 0 4px rgba(59,23,23,0.1);
        }
        .tier-card h3 {
            font-family: 'DynaPuff', cursive;
            color: #3b1717;
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }
        .tier-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3b1717;
            margin-bottom: 1rem;
        }
        .tier-limit {
            display: inline-block;
            background: #ffe066;
            color: #3b1717;
            padding: 0.4rem 1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* Step 2: Builder Layout */
        .builder-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 2rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            display: none;
        }
        .builder-layout.active {
            opacity: 1;
            pointer-events: auto;
            display: grid;
        }

        /* Products Section */
        .toolbar {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .search-box, .filter-box {
            padding: 0.8rem 1.2rem;
            border-radius: 999px;
            border: 1px solid rgba(59,23,23,0.1);
            background: #fff;
            font-family: 'Elms Sans', sans-serif;
            color: #3b1717;
            flex: 1;
            min-width: 200px;
            outline: none;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }
        .product-card {
            background: #fff;
            border-radius: 20px;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            position: relative;
        }
        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
        }
        .product-badge {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            background: #3b1717;
            color: #fff;
            padding: 0.3rem 0.8rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .product-info {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-cat {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.2rem;
        }
        .product-name {
            font-weight: 700;
            color: #3b1717;
            font-size: 1.1rem;
            margin: 0 0 0.5rem;
        }
        .product-price {
            color: #555;
            font-weight: 600;
            margin-top: auto;
        }
        .add-btn {
            background: #ffe066;
            color: #3b1717;
            border: none;
            padding: 0.7rem;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }
        .add-btn:hover:not(:disabled) {
            background: #ffd633;
        }
        .add-btn:disabled {
            background: #eee;
            color: #aaa;
            cursor: not-allowed;
        }

        /* Sticky Summary */
        .summary-sidebar {
            position: sticky;
            top: 2rem;
            height: fit-content;
        }
        .summary-card {
            background: #fffdf1;
            border-radius: 24px;
            padding: 1.5rem;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
            border: 1px solid rgba(59,23,23,0.05);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .summary-header h3 {
            font-family: 'DynaPuff', cursive;
            color: #3b1717;
            margin: 0 0 0.5rem;
            font-size: 1.5rem;
        }
        .progress-container {
            background: rgba(59,23,23,0.05);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .progress-bar {
            height: 100%;
            background: #3b1717;
            width: 0%;
            transition: width 0.3s ease;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #3b1717;
            font-weight: 700;
        }
        
        .visual-hamper {
            background: rgba(255,255,255,0.6);
            border-radius: 16px;
            padding: 1rem;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            align-content: flex-start;
        }
        .visual-item {
            position: relative;
            width: 48px;
            height: 48px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .visual-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(59,23,23,0.1);
        }
        .visual-item .remove-btn {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            background: #ff4d4d;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .empty-visual {
            width: 100%;
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            padding-top: 1rem;
        }

        .summary-totals {
            border-top: 2px dashed rgba(59,23,23,0.1);
            padding-top: 1rem;
        }
        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            color: #555;
        }
        .total-row.final {
            color: #3b1717;
            font-size: 1.3rem;
            font-weight: 700;
            margin-top: 0.5rem;
        }
        .checkout-btn {
            background: #3b1717;
            color: #fff;
            border: none;
            padding: 1rem;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .checkout-btn:hover:not(:disabled) {
            background: #502f2f;
        }
        .checkout-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #3b1717;
            color: #fff;
            padding: 1rem 2rem;
            border-radius: 999px;
            font-weight: 700;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(59,23,23,0.3);
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @media (max-width: 992px) {
            .builder-layout, .builder-layout.active {
                grid-template-columns: 1fr;
            }
            .summary-sidebar {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                z-index: 1000;
            }
            .summary-card {
                border-radius: 24px 24px 0 0;
                padding: 1rem;
                gap: 1rem;
                box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            }
            .visual-hamper {
                display: none; /* Hide visual on mobile to save space */
            }
            .builder-container {
                margin-bottom: 250px; /* Space for fixed bottom bar */
            }
        }
        @media (max-width: 600px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 1rem;
            }
            .product-card {
                padding: 0.8rem;
            }
            .product-card img {
                height: 120px;
            }
            .product-badge {
                top: 0.8rem;
                left: 0.8rem;
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem;
            }
            .product-name {
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a class="nav-brand" href="index.html">GLAM AURA</a>
            <div style="display: flex; align-items: center; gap: 1.5rem;">
                <a href="shopping-guide.html" style="font-family: 'Elms Sans', sans-serif; font-weight: 700; color: #3b1717; text-decoration: none; font-size: 1rem; transition: color 0.3s ease;">Shopping Guide</a>
                <div class="cart-icon" onclick="window.location.href='checkout.html'">
                    <span class="material-symbols-outlined">shopping_cart</span>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
            </div>
        </div>
    </nav>
    <script>
        // Minimal cart count sync
        (function () {
            try {
                var raw = localStorage.getItem('glamAuraCartData');
                var cart = raw ? JSON.parse(raw) : { items: [] };
                var items = (cart && cart.items) || [];
                var count = items.reduce(function (sum, item) {
                    return sum + (item.quantity || 0);
                }, 0);
                var badge = document.getElementById('cartCount');
                if (badge) badge.textContent = count;
            } catch (e) {}
        })();
    </script>

    <main class="builder-container">
        <div class="header-section">
            <h2>Build Your Own Hamper</h2>
            <p>Select a hamper size below to start curating your perfect gift.</p>
        </div>

        <div class="tiers-grid" id="tiersGrid">
            <!-- Rendered by JS -->
        </div>

        <div class="builder-layout" id="builderLayout">
            <!-- Main Content -->
            <div class="main-content">
                <div class="toolbar">
                    <input type="text" class="search-box" id="searchInput" placeholder="Search products...">
                    <select class="filter-box" id="categoryFilter">
                        <option value="All">All Categories</option>
                        <option value="Hair Accessories">Hair Accessories</option>
                        <option value="Handmade Jewellery">Handmade Jewellery</option>
                        <option value="Crochet Collection">Crochet Collection</option>
                        <option value="Accessories">Accessories</option>
                    </select>
                </div>
                <div class="products-grid" id="productsGrid">
                    <!-- Rendered by JS -->
                </div>
            </div>

            <!-- Sticky Summary -->
            <div class="summary-sidebar">
                <div class="summary-card">
                    <div class="summary-header">
                        <h3 id="summaryHamperName">Select a Hamper</h3>
                        <div class="progress-container">
                            <div class="progress-bar" id="summaryProgressBar"></div>
                        </div>
                        <div class="progress-text">
                            <span id="summaryItemsCount">0 / 0 Items</span>
                            <span id="summaryRemaining">0 slots left</span>
                        </div>
                    </div>

                    <div class="visual-hamper" id="visualHamper">
                        <!-- Rendered by JS -->
                        <div class="empty-visual">Your hamper is empty. Add items!</div>
                    </div>

                    <div class="summary-totals">
                        <div class="total-row">
                            <span>Estimated Product Value:</span>
                            <span id="estValue">₹0</span>
                        </div>
                        <div class="total-row final">
                            <span>Amount to Pay:</span>
                            <span id="finalPrice">₹0</span>
                        </div>
                    </div>

                    <button class="checkout-btn" id="addToCartBtn" disabled>Add to Cart</button>
                </div>
            </div>
        </div>
    </main>

    <div class="toast" id="toastMsg">Maximum items reached for this hamper.</div>

    <script>
        // Data Configuration
        const tiers = [
            { id: 'mini', name: 'Mini Hamper', price: 299, limit: 5 },
            { id: 'classic', name: 'Classic Hamper', price: 499, limit: 8 },
            { id: 'premium', name: 'Premium Hamper', price: 799, limit: 12 },
            { id: 'luxury', name: 'Luxury Hamper', price: 1199, limit: 18 }
        ];

        const products = [
            // Hair Accessories
            { id: 'h1', name: 'Hawaiian Clutcher', category: 'Hair Accessories', price: 50, image: 'assets/custom hamper/placeholder.jpg', badge: 'Best Seller' },
            { id: 'h2', name: 'Sunflower Clutcher', category: 'Hair Accessories', price: 50, image: 'assets/custom hamper/placeholder.jpg' },
            { id: 'h3', name: 'Tulip Bow Clip', category: 'Hair Accessories', price: 70, image: 'assets/custom hamper/placeholder.jpg' },
            { id: 'h4', name: 'Tulip Scrunchie', category: 'Hair Accessories', price: 60, image: 'assets/custom hamper/placeholder.jpg' },
            { id: 'h5', name: 'Hearty Clip', category: 'Hair Accessories', price: 40, image: 'assets/custom hamper/placeholder.jpg' },
            { id: 'h6', name: 'Check Clip', category: 'Hair Accessories', price: 40, image: 'assets/custom hamper/placeholder.jpg' },
            { id: 'h7', name: 'Aesthetic Clip', category: 'Hair Accessories', price: 45, image: 'assets/custom hamper/placeholder.jpg' },
            
            // Handmade Jewellery
            { id: 'j1', name: 'Handmade Necklace', category: 'Handmade Jewellery', price: 180, image: 'assets/custom hamper/placeholder.jpg', badge: 'Handmade' },
            { id: 'j2', name: 'Pendant', category: 'Handmade Jewellery', price: 120, image: 'assets/custom hamper/placeholder.jpg', badge: 'Handmade' },
            { id: 'j3', name: 'Bracelet', category: 'Handmade Jewellery', price: 100, image: 'assets/custom hamper/green bracelet.jpg', badge: 'Handmade' },
            { id: 'j4', name: 'Earrings', category: 'Handmade Jewellery', price: 55, image: 'assets/custom hamper/blue earings.jpg', badge: 'Handmade' },
            
            // Crochet Collection
            { id: 'c1', name: 'Crochet Tulip Bouquet', category: 'Crochet Collection', price: 179, image: 'assets/custom hamper/crochet tulip boquet.png', badge: 'Handmade' },
            { id: 'c2', name: 'Crochet Keychain', category: 'Crochet Collection', price: 89, image: 'assets/custom hamper/placeholder.jpg', badge: 'New' },
            
            // Accessories
            { id: 'a1', name: 'Keychain', category: 'Accessories', price: 80, image: 'assets/custom hamper/placeholder.jpg' },
            { id: 'a2', name: 'Phone Charm', category: 'Accessories', price: 120, image: 'assets/custom hamper/placeholder.jpg' }
        ];

        // State
        let selectedTier = null;
        let selectedItems = []; // Array of product objects { product, instanceId }
        
        // DOM Elements
        const tiersGrid = document.getElementById('tiersGrid');
        const builderLayout = document.getElementById('builderLayout');
        const productsGrid = document.getElementById('productsGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryFilter = document.getElementById('categoryFilter');
        
        const summaryHamperName = document.getElementById('summaryHamperName');
        const summaryProgressBar = document.getElementById('summaryProgressBar');
        const summaryItemsCount = document.getElementById('summaryItemsCount');
        const summaryRemaining = document.getElementById('summaryRemaining');
        const estValueEl = document.getElementById('estValue');
        const finalPriceEl = document.getElementById('finalPrice');
        const visualHamper = document.getElementById('visualHamper');
        const addToCartBtn = document.getElementById('addToCartBtn');
        const toastMsg = document.getElementById('toastMsg');

        // Initialization
        function init() {
            renderTiers();
            renderProducts();
            
            searchInput.addEventListener('input', renderProducts);
            categoryFilter.addEventListener('change', renderProducts);
            addToCartBtn.addEventListener('click', addToCart);
        }

        // Render Tiers
        function renderTiers() {
            tiersGrid.innerHTML = tiers.map(tier => `
                <div class="tier-card ${selectedTier?.id === tier.id ? 'selected' : ''}" onclick="selectTier('${tier.id}')">
                    <h3>${tier.name}</h3>
                    <div class="tier-price">₹${tier.price}</div>
                    <div class="tier-limit">Up to ${tier.limit} items</div>
                </div>
            `).join('');
        }

        // Select Tier
        function selectTier(tierId) {
            const newTier = tiers.find(t => t.id === tierId);
            
            if (selectedTier && selectedItems.length > newTier.limit) {
                // Warning if downgrading and already over limit
                if(!confirm(`Switching to ${newTier.name} will keep only your first ${newTier.limit} items. Continue?`)) {
                    return;
                }
                // Trim items to new limit
                selectedItems = selectedItems.slice(0, newTier.limit);
            }
            
            selectedTier = newTier;
            renderTiers();
            builderLayout.classList.add('active');
            
            // Scroll to builder smoothly
            setTimeout(() => {
                builderLayout.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
            
            updateSummary();
            renderProducts(); // Re-render to update disabled states
        }

        // Render Products
        function renderProducts() {
            const searchTerm = searchInput.value.toLowerCase();
            const category = categoryFilter.value;
            
            const filtered = products.filter(p => {
                const matchSearch = p.name.toLowerCase().includes(searchTerm);
                const matchCategory = category === 'All' || p.category === category;
                return matchSearch && matchCategory;
            });
            
            const isAtLimit = selectedTier && selectedItems.length >= selectedTier.limit;
            
            productsGrid.innerHTML = filtered.map(product => `
                <div class="product-card">
                    ${product.badge ? `<div class="product-badge">${product.badge}</div>` : ''}
                    <img src="${product.image}" alt="${product.name}" onerror="this.src='assets/custom-hamper.jpg'">
                    <div class="product-info">
                        <div class="product-cat">${product.category}</div>
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">₹${product.price}</div>
                    </div>
                    <button class="add-btn" onclick="addItem('${product.id}')" ${isAtLimit ? 'disabled' : ''}>
                        <span class="material-symbols-outlined">add</span> Add to Hamper
                    </button>
                </div>
            `).join('');
        }

        // Add Item
        function addItem(productId) {
            if (!selectedTier || selectedItems.length >= selectedTier.limit) {
                showToast("Maximum items reached for this hamper.");
                return;
            }
            
            const product = products.find(p => p.id === productId);
            selectedItems.push({
                product,
                instanceId: Date.now() + Math.random().toString(36).substr(2, 5)
            });
            
            updateSummary();
            renderProducts();
            
            if (selectedItems.length >= selectedTier.limit) {
                showToast("Maximum items reached for this hamper.");
            }
        }

        // Remove Item
        function removeItem(instanceId) {
            selectedItems = selectedItems.filter(item => item.instanceId !== instanceId);
            updateSummary();
            renderProducts();
        }

        // Update Summary & Visuals
        function updateSummary() {
            if (!selectedTier) return;
            
            const count = selectedItems.length;
            const limit = selectedTier.limit;
            const remaining = limit - count;
            const progress = (count / limit) * 100;
            const estValue = selectedItems.reduce((sum, item) => sum + item.product.price, 0);
            
            summaryHamperName.textContent = selectedTier.name;
            summaryItemsCount.textContent = `${count} / ${limit} Items`;
            summaryRemaining.textContent = `${remaining} slot${remaining !== 1 ? 's' : ''} left`;
            summaryProgressBar.style.width = `${progress}%`;
            
            estValueEl.textContent = `₹${estValue}`;
            finalPriceEl.textContent = `₹${selectedTier.price}`;
            
            addToCartBtn.disabled = count === 0;
            addToCartBtn.textContent = count === 0 ? 'Add items first' : `Add to Cart (₹${selectedTier.price})`;
            
            // Visual Hamper
            if (count === 0) {
                visualHamper.innerHTML = '<div class="empty-visual">Your hamper is empty. Add items!</div>';
            } else {
                visualHamper.innerHTML = selectedItems.map(item => `
                    <div class="visual-item" title="${item.product.name}">
                        <img src="${item.product.image}" alt="${item.product.name}" onerror="this.src='assets/custom-hamper.jpg'">
                        <div class="remove-btn" onclick="removeItem('${item.instanceId}')">×</div>
                    </div>
                `).join('');
            }
        }

        // Show Toast
        let toastTimeout;
        function showToast(message) {
            toastMsg.textContent = message;
            toastMsg.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastMsg.classList.remove('show');
            }, 3000);
        }

        // Add to Cart
        function addToCart() {
            if (selectedItems.length === 0) return;
            
            const itemsString = selectedItems.map(i => i.product.name).reduce((acc, name) => {
                acc[name] = (acc[name] || 0) + 1;
                return acc;
            }, {});
            
            const formattedItems = Object.entries(itemsString).map(([name, qty]) => `${name} x${qty}`).join(' | ');
            
            const customProduct = {
                id: `Custom Hamper - ${Date.now()}`,
                name: selectedTier.name,
                customName: selectedTier.name,
                customNote: `Includes: ${formattedItems}`,
                price: selectedTier.price,
                image: 'assets/custom-hamper.jpg',
                items: formattedItems,
                quantity: 1,
                isCustom: true
            };
            
            const existing = JSON.parse(localStorage.getItem('glamAuraCartData') || '{"items":[],"note":""}');
            existing.items.push(customProduct);
            localStorage.setItem('glamAuraCartData', JSON.stringify(existing));
            
            window.location.href = 'checkout.html';
        }

        // Run init
        init();
    </script>
</body>
</html>
